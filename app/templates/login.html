{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="centrado tarjeta">
  <h1>Iniciar sesión</h1>
  <p class="sub">Sistema de alertas de las salas de cómputo. Solo personal autorizado.</p>
  {% if error %}<div class="mensaje error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <p><label for="correo">Correo</label><input id="correo" name="correo" type="email" autocomplete="username" required class="ancho-total"></p>
    <p><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required class="ancho-total"></p>
    <button type="submit" class="ancho-total">Entrar</button>
  </form>
</div>
{% endblock %}
