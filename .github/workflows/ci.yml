name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias del servicio y de las pruebas
        run: pip install -r requirements.txt -r requirements-detector.txt pytest
      - name: Ejecutar pruebas
        run: python -m pytest -q
